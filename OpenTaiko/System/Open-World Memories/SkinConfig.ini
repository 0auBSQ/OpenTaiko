;Skin information
Name=Open-World Memories V2: Gleaming Sky
DefaultLocale=en
Version=0.6.0.24
Creator=Dashy
Resolution=1920,1080
;Selectable render-scale multipliers (<=1; decimal or a/b fraction, comma-separated). 1 is always available + default.
Resolutions=1,2/3,1/3
;Character folder used for the AI battle slot.
AIBattleCharacter=10v2 - AItritus
;Nameplate the AI battle opponent wears (an id from the nameplate list).
AIBattleNameplate=66
FontNameEN=Fonts/MPLUSRounded1c-Medium.ttf
FontNameJA=Fonts/MPLUSRounded1c-Medium.ttf
FontNameFR=Fonts/MPLUSRounded1c-Medium.ttf
FontNameES=Fonts/MPLUSRounded1c-Medium.ttf
FontNameNL=Fonts/MPLUSRounded1c-Medium.ttf
FontNameDE=Fonts/MPLUSRounded1c-Medium.ttf
FontNameRU=Fonts/MPLUSRounded1c-Medium.ttf
FontNameKO=Fonts/ResourceHanRoundedKR-Medium.ttf
FontNameZH=Fonts/ResourceHanRoundedCN-Medium.ttf
BoxFontNameEN=Fonts/MPLUSRounded1c-Regular.ttf
BoxFontNameJA=Fonts/MPLUSRounded1c-Regular.ttf
BoxFontNameFR=Fonts/MPLUSRounded1c-Regular.ttf
BoxFontNameES=Fonts/MPLUSRounded1c-Regular.ttf
BoxFontNameNL=Fonts/MPLUSRounded1c-Regular.ttf
BoxFontNameDE=Fonts/MPLUSRounded1c-Regular.ttf
BoxFontNameRU=Fonts/MPLUSRounded1c-Regular.ttf
BoxFontNameKO=Fonts/ResourceHanRoundedKR-Regular.ttf
BoxFontNameZH=Fonts/ResourceHanRoundedCN-Regular.ttf
;Fonts for the characters the font in use lacks (Chinese, Korean...), tried in order before the system's own fonts.
;FontFallbacksMain: for the text in the FontName fonts (and lyrics). FontFallbacksSub: for the text in the BoxFontName fonts; when missing, the Main list is used.
FontFallbacksMain=Fonts/ResourceHanRoundedCN-Medium.ttf,Fonts/ResourceHanRoundedKR-Medium.ttf
FontFallbacksSub=Fonts/ResourceHanRoundedCN-Regular.ttf,Fonts/ResourceHanRoundedKR-Regular.ttf
;The fonts' kerning between neighbouring letters (AV, Ta sit closer): 1 on (default), 0 off. Vertical text never kerns.
FontKerning=1
;The fonts' proportional widths for Japanese (OpenType palt; fonts without it are unchanged): 1 on, 0 off (default, full-width spacing).
FontPalt=0

